<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — SudsOnTheGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:          #05091a;
      --bg2:         #090f24;
      --surface:     rgba(14, 22, 52, 0.70);
      --surface2:    rgba(14, 22, 52, 0.95);
      --border:      rgba(99, 138, 220, 0.18);
      --border-soft: rgba(99, 138, 220, 0.10);
      --text:        #eef2ff;
      --text-muted:  #8fa8d4;
      --brand:       #3b82f6;
      --brand2:      #1d4ed8;
      --brand3:      #60a5fa;
      --mint:        #34d399;
      --red:         #f87171;
      --glow:        rgba(59,130,246,0.40);
      --radius:      16px;
      --radius-lg:   24px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 900;
      font-size: 1.15rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(150deg, var(--brand), var(--brand2));
      box-shadow: 0 6px 20px var(--glow);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .logo span { color: var(--brand3); }

    nav {
      position: relative;
      z-index: 10;
      padding: 1.25rem 0;
      background: rgba(5, 9, 26, 0.80);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-soft);
    }

    .nav-inner {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--text);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    .signin-container {
      width: 100%;
      max-width: 440px;
    }

    .signin-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .signin-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .signin-header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .signin-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .required {
      color: var(--red);
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      background: rgba(5, 9, 26, 0.60);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--brand);
      background: rgba(5, 9, 26, 0.80);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.9rem 1.6rem;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(160deg, var(--brand) 0%, var(--brand2) 100%);
      color: #fff;
      box-shadow: 0 8px 28px var(--glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 36px var(--glow);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .demo-credentials {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.2);
      border-radius: var(--radius);
    }

    .demo-credentials h3 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--mint);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .demo-credentials p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0.25rem 0;
    }

    .demo-credentials code {
      color: var(--text);
      background: rgba(0,0,0,0.3);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 0.85rem;
    }

    .error-message {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: var(--radius);
      color: var(--red);
      font-size: 0.9rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    @media (max-width: 480px) {
      .signin-card {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-icon">🫧</span>
      Suds<span>OnTheGo</span>
    </a>
    <a href="index.html" class="back-link">← Back to home</a>
  </div>
</nav>

<main>
  <div class="signin-container">
    <div class="signin-card">
      <div class="signin-header">
        <h1>Welcome back</h1>
        <p>Sign in to access your account</p>
      </div>

      <form id="signinForm">
        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn btn-primary">Sign In</button>

        <div id="errorMessage" class="error-message"></div>
      </form>

      <div class="demo-credentials">
        <h3>🎯 Demo Credentials</h3>
        <p>Email: <code>demo@sudsonthego.com</code></p>
        <p>Password: <code>demo123</code></p>
      </div>
    </div>
  </div>
</main>

<script src="auth.js"></script>
<script>
  const form = document.getElementById('signinForm');
  const errorMessage = document.getElementById('errorMessage');
  const submitBtn = form.querySelector('button[type="submit"]');

  // Check if already authenticated
  if (auth.isAuthenticated()) {
    window.location.href = 'account.html';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    // Disable button and show loading state
    const originalText = submitBtn.textContent;
    submitBtn.textContent = 'Signing in...';
    submitBtn.disabled = true;
    errorMessage.classList.remove('show');
    
    try {
      // Use real Supabase authentication
      const result = await auth.signIn(email, password);
      
      if (result.success) {
        // Set backward-compatible sessionStorage for existing code
        sessionStorage.setItem('isAuthenticated', 'true');
        sessionStorage.setItem('userEmail', email);
        
        // Redirect to account page
        window.location.href = 'account.html';
      } else {
        throw new Error(result.error || 'Authentication failed');
      }
    } catch (error) {
      // Show error message
      errorMessage.textContent = `❌ ${error.message}`;
      errorMessage.classList.add('show');
      
      // Reset button
      submitBtn.textContent = originalText;
      submitBtn.disabled = false;
      
      setTimeout(() => {
        errorMessage.classList.remove('show');
      }, 5000);
    }
  });

  // Fallback to mock auth if Supabase not configured
  // Remove this section once Supabase is set up
  if (auth.SUPABASE_URL === 'https://your-project-ref.supabase.co') {
    console.warn('⚠️ Supabase not configured. Using demo mode.');
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (email === 'demo@sudsonthego.com' && password === 'demo123') {
        sessionStorage.setItem('isAuthenticated', 'true');
        sessionStorage.setItem('userEmail', email);
        window.location.href = 'account.html';
      } else {
        errorMessage.textContent = '❌ Invalid credentials. Try: demo@sudsonthego.com / demo123';
        errorMessage.classList.add('show');
      }
    }, { once: true });
  }
</script>

</body>
</html>
